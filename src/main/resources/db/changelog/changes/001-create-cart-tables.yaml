databaseChangeLog:
  - changeSet:
      id: 001-create-carts
      author: kanapa4
      changes:
        - createTable:
            tableName: carts
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: version, type: bigint }
              - column: { name: created_at, type: "timestamp with time zone" }
              - column: { name: updated_at, type: "timestamp with time zone" }
        - sql:
            sql: CREATE UNIQUE INDEX ux_carts_user_active ON carts (user_id) WHERE status = 'ACTIVE'

  - changeSet:
      id: 002-create-cart-items
      author: kanapa4
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: cart_id, type: uuid, constraints: { nullable: false } }
              - column: { name: product_id, type: uuid, constraints: { nullable: false } }
              - column: { name: product_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: unit_price, type: "numeric(19,2)", constraints: { nullable: false } }
              - column: { name: currency, type: varchar(3), constraints: { nullable: false } }
              - column: { name: vat_rate, type: varchar(16), constraints: { nullable: false } }
              - column: { name: quantity, type: int, constraints: { nullable: false } }
              - column: { name: selected_options, type: jsonb }
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: carts
            referencedColumnNames: id
            constraintName: fk_cart_items_cart
        - createIndex:
            tableName: cart_items
            indexName: idx_cart_items_cart
            columns:
              - column: { name: cart_id }